
devices: ({
  name: "MX Master 3 for Mac";

  smartshift: { on: true; threshold: 20; };
  hiresscroll: { hires: true; invert: false; target: false; };
  dpi: 1000;

  buttons: (
    // Back button => Volume Down
    { cid: 0x53; action = { type: "Keypress"; keys: ["KEY_VOLUMEDOWN"]; }; },
    // Forward button => Volume Up
    { cid: 0x56; action = { type: "Keypress"; keys: ["KEY_VOLUMEUP"]; }; }
  );
});

